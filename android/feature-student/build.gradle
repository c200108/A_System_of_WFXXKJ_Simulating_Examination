plugins {
    id 'com.android.library'
}

// 功能模块：学生（学生账号、班级）
// 只依赖 core，不依赖别的功能模块。
android {
    namespace 'cn.wfxxkj.teacher.student'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
