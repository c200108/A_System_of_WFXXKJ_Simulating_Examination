plugins {
    id 'com.android.library'
}

// 功能模块：组卷（按题型和数量抽题、预览、导出、组卷历史）
// 只依赖 core，不依赖别的功能模块。
android {
    namespace 'cn.wfxxkj.teacher.paper'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
