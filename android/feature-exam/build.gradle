plugins {
    id 'com.android.library'
}

// 功能模块：考试（考试管理、成绩与分析、打字学情、练习文本）
// 只依赖 core，不依赖别的功能模块。
android {
    namespace 'cn.wfxxkj.teacher.exam'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
