plugins {
    id 'com.android.library'
}

// 功能模块：API（老师建接口收第三方教学网页的数据）
// 只依赖 core，不依赖别的功能模块。
android {
    namespace 'cn.wfxxkj.teacher.dataapi'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
