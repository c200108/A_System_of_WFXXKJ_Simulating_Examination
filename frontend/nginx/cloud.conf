# 个人云盘（2.25.0）：/cloud/ 转给 docker-compose.yml 里的 openlist 服务（OpenList 的 SITE_URL 就是 /cloud）。
# 怎么搭的、配额怎么管，见 backend/app/services/cloud.py 开头。
#
# 和 static.conf、backend.conf 一样由 nginx.conf / https.conf 引进来；https 时只在 443 上有，80 上跳转。

# openlist 不写死在 proxy_pass 里，而是放进变量、用 docker 的内置 DNS 现查：
# 写死的话 nginx 启动时就要解析这个名字，openlist 容器没起来（或者老的 compose 里压根没有它）
# 整个前端都起不来，考试也考不了。放进变量后只有访问 /cloud 时才查，查不到只是云盘打不开。
resolver 127.0.0.11 ipv6=off valid=30s;
set $openlist_upstream http://openlist:5244;

location = /cloud {
    return 302 /cloud/;
}

# ^~：OpenList 的 .js/.css/.png 不能被 static.conf 里那条按扩展名的正则截走
location ^~ /cloud/ {
    # 文件多大由配额管（上传前问后端），这里不限；不缓冲，大文件边收边转
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    error_page 502 503 504 = @cloud_down;
    proxy_pass $openlist_upstream;

    # 改密码、改用户名只能在教学平台「我的账号」里改：免登录要用后端存着的云盘密码，在这里改了就对不上了
    location = /cloud/api/me/update {
        default_type application/json;
        return 200 '{"code":403,"message":"云盘密码请在教学平台「我的账号」里修改","data":null}';
    }

    # 上传：先问后端额度够不够（Content-Length 交给后端比）
    location ~ ^/cloud/api/fs/(put|form)$ {
        auth_request /_cloud_gate;
        auth_request_set $cloud_reason $upstream_http_x_cloud_reason;
        error_page 401 403 = @cloud_refused;
        # 请求头、超时、不缓冲这些都从外层 /cloud/ 继承下来，只有 proxy_pass 不继承
        proxy_pass $openlist_upstream;
    }

    # 复制、解压：事先不知道多大，只要已经超了额度就不让做（后台每 5 分钟量一次，超了也会收回权限）
    location ~ ^/cloud/api/fs/(copy|archive/decompress)$ {
        auth_request /_cloud_gate_other;
        auth_request_set $cloud_reason $upstream_http_x_cloud_reason;
        error_page 401 403 = @cloud_refused;
        proxy_pass $openlist_upstream;
    }

    # 分块上传、离线下载、种子秒传：都绕得过上面的额度检查，一律不开
    location ~ ^/cloud/api/fs/(multipart/|add_offline_download|torrent/|seed/|get_direct_upload_info) {
        default_type application/json;
        return 200 '{"code":403,"message":"个人云盘没有开放这个功能","data":null}';
    }
}

location = /_cloud_gate {
    internal;
    proxy_pass http://backend:8000/api/cloud/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Upload-Length $http_content_length;
    proxy_set_header X-Upload-Kind put;
}

location = /_cloud_gate_other {
    internal;
    proxy_pass http://backend:8000/api/cloud/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Upload-Kind other;
}

# 拒绝时按 OpenList 自己的格式回 200 + code，它的网页会把 message 弹出来
location @cloud_refused {
    default_type application/json;
    if ($cloud_reason = over) {
        return 200 '{"code":403,"message":"个人云盘空间不够了：删掉一些文件，或者请系统管理员加大分配的空间","data":null}';
    }
    if ($cloud_reason = total) {
        return 200 '{"code":403,"message":"全校云盘总容量已经用完，请联系系统管理员","data":null}';
    }
    if ($cloud_reason = none) {
        return 200 '{"code":403,"message":"你还没有分配个人云盘空间，请联系系统管理员","data":null}';
    }
    if ($cloud_reason = nolength) {
        return 200 '{"code":403,"message":"上传请求没有文件大小，换个浏览器试试","data":null}';
    }
    return 200 '{"code":401,"message":"登录已失效，请重新打开个人云盘","data":null}';
}

location @cloud_down {
    default_type text/html;
    charset utf-8;
    return 503 '<!doctype html><meta charset="utf-8"><title>个人云盘暂时打不开</title><body style="font-family:sans-serif;text-align:center;padding-top:15vh;color:#555"><h2>个人云盘暂时打不开</h2><p>云盘服务（OpenList）没有启动或者正在重启，过一两分钟再刷新试试。</p><p>一直打不开请联系系统管理员：服务器上运行 <code>sudo docker compose up -d</code> 查看。</p><p><a href="/js/paper">← 返回教学平台</a></p></body>';
}
