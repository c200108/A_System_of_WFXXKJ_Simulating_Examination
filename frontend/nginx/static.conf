# 前端网页本身：带指纹的静态资源长缓存、index.html 不缓存、单页应用回退、接口文档。

# ---------------------------------------------------------------- 静态资源
# 构建出来的文件名里带内容指纹（index-D-SGWCdP.js），内容一变文件名就变，
# 所以可以放心让浏览器长期缓存：第二次开考完全不用再下载。
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# index.html 绝不能缓存：它记着这次该加载哪几个带指纹的文件，
# 缓存住的话发了新版本学生还在用旧的。
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# 前端是单页应用，刷新任意路由都回 index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 接口文档，维护时直接在浏览器里调接口
location ~ ^/(docs|redoc|openapi.json) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
}
