# 开了 HTTPS 时用的配置。由 40-exam-https.sh 把 __HTTPS_ORIGIN__ 换成真实地址后
# 写到 /etc/nginx/conf.d/default.conf，不要直接拿去用。

# ---------------------------------------------------------------- 80：跳转
# 网页一律跳到 https。但 /api/ 和 /uploads/ 照旧在 http 上直接服务：
# 学生端 exe 不跟随跳转，填着 http 地址的老 exe 不能因为开了 https 就连不上。
# （它们照旧是明文，想全程加密就把 exe 里的服务器地址改成 https 的。）
server {
    listen 80;
    server_name _;

    include /etc/nginx/exam/base.conf;
    include /etc/nginx/exam/backend.conf;

    location / {
        return 301 __HTTPS_ORIGIN__$request_uri;
    }
}

# ---------------------------------------------------------------- 443：正式服务
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书目录由 docker-compose.yml 只读挂进来（宿主机上是 .env 里的 SSL_CERT_DIR）。
    # acme.sh 续期后文件内容会变，40-exam-https.sh 里的巡检会自动 nginx -s reload。
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # 一个机房几十台同时开考，会话复用能省掉大半次完整握手
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/exam/base.conf;
    include /etc/nginx/exam/static.conf;
    include /etc/nginx/exam/backend.conf;
}
