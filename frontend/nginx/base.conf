# 每个 server 都要的公共设置：上传大小、网页目录、gzip。
# 由 default.conf / https.conf 用 include 引进来，自己不是完整配置。

client_max_body_size 30m;

root /usr/share/nginx/html;
index index.html;

# ---------------------------------------------------------------- 压缩
# 一个机房五十到一百台机器同时开考，首屏那几个 js 是一模一样的五十份流量。
# 压完大约只剩三成，最费带宽的那几秒就是靠这条扛过去的。
gzip on;
gzip_vary on;
gzip_comp_level 5;          # 5 是体积和 CPU 的平衡点，再高省不了多少
gzip_min_length 1024;       # 太小的文件压了反而不划算
gzip_proxied any;
gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    image/svg+xml font/ttf font/otf;
