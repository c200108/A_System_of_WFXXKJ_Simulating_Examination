# 转给后端的两条：/api/ 接口和 /uploads/ 配图。
#
# 单独成一个文件，是因为开了 HTTPS 以后 80 端口上**这两条照旧直接服务、不跳转**：
# 学生端 exe 用的是 http.client，不跟随 301/302，填着 http 地址的 exe 一跳转就全挂。
# 网页则会被跳到 https，之后的接口请求也都走 https。

# ^~ 同下面 /uploads/：以后哪个接口地址恰好以 .png/.css 结尾，也不会被静态文件那条正则截走
location ^~ /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 交卷高峰期后端可能要排队，给足超时，别让学生看到 504
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# 题目配图、反馈图片都在后端的 uploads 目录里，转给后端。
#
# **必须带 ^~**：static.conf 里那条「按扩展名缓存」的正则 location（\.(png|jpg|…)$）
# 优先级比普通前缀高，不带 ^~ 的话 /uploads/images/x.jpg 先被它截走，
# 去前端自己的 html 目录里找 —— 找不到就 404。症状是题库、组卷、网页答题
# 里的配图全裂，只有 exe 正常（exe 的图是打在考试包里、走 /api 下来的）。
# ^~ 的意思是：前缀匹配上了就用这一条，不再看正则。
location ^~ /uploads/ {
    proxy_pass http://backend:8000;
    expires 7d;
    add_header Cache-Control "public";
}
