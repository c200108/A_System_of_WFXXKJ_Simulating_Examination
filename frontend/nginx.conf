# 默认配置：只开 80（http）。没配证书的学校一直用的就是它，和以前完全一样。
#
# 真正的规则拆在 nginx/ 下面三个文件里，这里和 nginx/https.conf 共用：
#   base.conf     上传大小、网页目录、gzip
#   static.conf   前端网页（静态资源缓存、单页应用回退、接口文档）
#   backend.conf  转给后端的 /api/ 和 /uploads/
#
# 配了证书（.env 里的 SSL_CERT_DIR + HTTPS_PORT）时，容器启动脚本
# nginx/40-exam-https.sh 会换成 nginx/https.conf，见 docs/部署指南.md「HTTPS」一节。
server {
    listen 80;
    server_name _;

    include /etc/nginx/exam/base.conf;
    include /etc/nginx/exam/static.conf;
    include /etc/nginx/exam/backend.conf;
}
