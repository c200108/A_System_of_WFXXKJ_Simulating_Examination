server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- 压缩
    # 一个机房五十到一百台机器同时开考，首屏那几个 js 是一模一样的五十份流量。
    # 压完大约只剩三成，最费带宽的那几秒就是靠这条扛过去的。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;          # 5 是体积和 CPU 的平衡点，再高省不了多少
    gzip_min_length 1024;       # 太小的文件压了反而不划算
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf;

    # ---------------------------------------------------------------- 静态资源
    # 构建出来的文件名里带内容指纹（index-D-SGWCdP.js），内容一变文件名就变，
    # 所以可以放心让浏览器长期缓存：第二次开考完全不用再下载。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html 绝不能缓存：它记着这次该加载哪几个带指纹的文件，
    # 缓存住的话发了新版本学生还在用旧的。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端是单页应用，刷新任意路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 交卷高峰期后端可能要排队，给足超时，别让学生看到 504
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 接口文档，维护时直接在浏览器里调接口
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        expires 7d;
        add_header Cache-Control "public";
    }
}
