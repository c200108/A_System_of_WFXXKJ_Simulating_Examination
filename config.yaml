      - "every key you press leaves a mark in the digital world, so type with care, write with kindness, and learn with an open mind."

      - "digital literacy is no longer optional; it shapes how students gather evidence, evaluate sources, and present arguments in nearly every subject they study."
      - "an algorithm is simply a sequence of clear steps, yet the discipline of writing one teaches precision that carries far beyond the computer lab."
      - "before sharing a file, consider who can open it, whether it contains personal information, and how long it should remain available online."
