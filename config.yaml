# ============================================================================
# 信息技术组卷台 —— 集中配置
#
# 这个文件管"系统怎么用"：卷头默认值、默认题量、及格线、导入时怎么认题型……
# 改完重启后端生效（双击 一键停止.bat 再双击 一键启动.bat）。
#
# 【不在这里的两类东西，别往这儿搬】
#   1. 密码和密钥（数据库密码、JWT 密钥、管理员初始密码）→ 在 backend/.env
#      因为本文件要提交进 Git，密钥写进来等于公开。
#   2. 知识范围、题型的日常增删 → 在系统界面里改（存数据库，即时生效）
#      本文件的 bank.scopes 只在"第一次建库"时用作初始值。
#
# 【改错了会怎样】
#   拼错键名或类型不对，后端启动时会直接报错并指出是哪一项，不会静默失效。
# ============================================================================

site:
  # 平台名称。改完 docker compose restart backend，刷新页面即生效，不用重新构建。
  title: "昌邑市实验中学信息科技教学平台" # 浏览器标签页、登录页大标题
  brand: "信息科技教学平台" # 顶栏左上角，短一点更好看
  footer: "" # 页脚备注，留空则不显示
  # 学生实践平台（网站根路径 /）的名称。教师后台在 /js。
  student_title: "昌邑市实验中学信息科技学生实践平台"
  student_brand: "学生实践平台" # 侧边栏顶部，长标题在那儿排不开
  # 浏览器标签页图标（校徽）。留空用内置的默认图标。
  # 换成校徽：把图片文件放进 data/uploads/（比如 data/uploads/校徽.png），
  # 这里填 "/uploads/校徽.png"，然后 docker compose restart backend 即可，
  # 不用重新构建前端。png / jpg / svg / ico 都行，建议正方形、不小于 64×64。
  favicon: "/uploads/校徽.png"

school:
  # 印在卷头上的学校名，也是组卷页"学校"一栏的默认值
  name: "昌邑市实验中学"

paper:
  default_title: "2026年信息技术模拟测试（A卷）"
  default_duration: "40" # 考试时长（分钟），填空字符串表示不印
  # 组卷页每种题型的默认数量。这里写的题型要和 bank.types 对得上
  default_counts:
    选择题: 20
    判断题: 10
    操作题: 3
  shuffle_options: true # 默认打乱选择题选项（答案自动跟随）
  require_answer: true # 默认跳过原卷未给答案的题
  use_pinned: true # 默认让必出题优先入选
  section_numerals: ["一", "二", "三", "四", "五", "六"] # 大题序号
  code_prefix: "NO." # 卷号前缀，生成形如 NO.20263

exam:
  pass_score: 60 # 及格线，成绩表里低于它标红
  token_length: 9 # 学生链接口令的随机字节数，越大越难猜（9 约等于 12 个字符）
  # 发布考试对话框里四个开关的默认状态
  defaults:
    is_open: true
    show_score: true # 交卷后给学生看分数
    show_answer: false # 交卷后给学生看答案（正式考试务必保持 false）
    allow_retake: false # 同一学号能否重考

bank:
  # false = 下面的 scopes/types 只在第一次建库时灌进数据库，之后以界面上的修改为准
  # true  = 每次启动都以本文件为准同步（界面上加的知识范围会被停用，慎用）
  sync_on_start: false
  scopes:
    - "信息基础与信息技术"
    - "计算机硬件"
    - "计算机软件"
    - "Windows系统操作"
    - "WPS文字操作"
    - "信息安全与网络道德"
    - "计算机网络基础"
    - "Python编程基础"
    - "人工智能"
    - "物联网"
  types: ["选择题", "判断题", "操作题", "填空题"]
  default_source: "自定义" # 新增/导入的题目，来源栏默认填什么

import:
  # 上传模板必须有这几列（顺序可以不同）
  headers: ["题型", "题干", "可选项", "答案", "知识范围", "图片"]
  # 导出题库/试卷 Excel 的表头
  export_headers: ["题型", "题干", "可选项", "答案", "知识范围", "来源", "编号"]
  export_widths: [8, 60, 34, 26, 16, 10, 9] # 上面各列的宽度
  # 题型识别：题型这一栏只要含有关键词之一，就算这种题型
  type_keywords:
    选择题: ["选择"]
    判断题: ["判断"]
    操作题: ["操作"]
    填空题: ["填空"]
  # 判断题答案归一：左边是入库后的标准写法，右边是老师可能填的各种写法
  judge_answers:
    正确: ["√", "对", "T", "true", "正确", "是"]
    错误: ["×", "x", "错", "F", "false", "错误", "否"]
  judge_options: [["A", "正确"], ["B", "错误"]] # 判断题自动补的两个选项
  option_separators: ".．、,，:：" # "A.内容" 里 A 和内容之间允许的分隔符
  max_options: 4 # 一道题最多认几个选项

upload:
  max_mb: 20 # 单个文件大小上限（图片和 Excel 都按这个）
  image_extensions: [".png", ".jpg", ".jpeg", ".gif", ".webp"]

typing:
  # 打字训练（学生页 /dazi，免登录；教师端在「打字」菜单看成绩）
  enabled: true
  difficulties: ["简单", "中等", "困难"]
  time_limits: [1, 2, 3, 5, 10] # 单位分钟，必须都大于 0（自由打字模块不限时，不走这里）
  default_difficulty: "简单"
  default_limit: 3
  passages_per_round: [7, 9] # 每次从文本库随机抽这么多段拼成长文
  three_star_min_speed: 18 # 简单难度之外，三星还要求速度达到这个值
  star_thresholds: # 正确率达到 base 给两星，base+12 给三星
    简单: 68
    中等: 80
    困难: 88

  # 文本库。改完 docker compose restart backend 即可生效，不用重新构建。
  english:
    简单:
      - "the quick brown fox jumps over the lazy dog."
      - "we learn typing every day and practice makes perfect."
