      - "keep your fingers on the home row and type slowly at first."
      - "practice a little each day and your speed will slowly grow."
      - "the cat sat on the mat and watched the little red ball roll away."
      - "my hand rests on the home row and my eyes stay on the screen."
      - "type slowly at first, then let your speed grow on its own."
      - "a short rest for the eyes keeps the mind clear and calm."
