# 固定项目名。不写的话 compose 会用目录名当项目名，数据卷名也跟着变 ——
# 从 GitHub 下载的 ZIP 解压出来是 xxx-main/，目录名一变卷名就变，
# 数据库看起来就"空了"。写死之后，目录叫什么都不影响数据。
name: exam-system

# 三个容器：数据库 / 后端 / 前端。
# 部署前先跑 python backend/tools/check_deploy.py 确认 .env 已改好。
#
# 对外只暴露 WEB_PORT 一个端口（配了 HTTPS 再加一个 HTTPS_PORT），
# 数据库和后端都只在内网，外面连不到。

x-logging: &default-logging
  # 不限制的话容器日志会一直涨，几个月后能把服务器磁盘写满
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${REGISTRY:-docker.io}/library/mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exam}
      MYSQL_USER: ${MYSQL_USER:-exam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在 .env 里设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 用**应用账号**真的查一次，而不是 mysqladmin ping。
      # ping 只看服务器答不答话：口令错了它照样打印 Access denied 然后退出码 0，
      # 于是 db 报 healthy、后端却连不上，最后只看到一句
      # 「container exam-system-backend-1 is unhealthy」，根本指不到病根。
      # 查的是后端将要用的那一套账号口令库名，这里过了后端就一定连得上。
      #
      # 写成 $$VAR 是让容器里的 shell 自己去取环境变量：compose 就不会把明文口令
      # 插进健康检查命令里，docker inspect 也看不到它。
      test:
        - CMD-SHELL
        - >-
          mysql -h localhost -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          -e 'SELECT 1' "$$MYSQL_DATABASE" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      # 第一次建库要几十秒，这期间应用账号还没建出来，给够时间
      start_period: 30s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-exam}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-exam}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 里设置 JWT_SECRET}
      UPLOAD_DIR: /app/data/uploads
      # 网页上「导入备份」「一键更新」交给宿主机主机助手的任务目录（scripts/host-agent.sh）
      HOST_JOBS_DIR: /app/data/host-jobs
      # 学生端「检查更新」的自建更新源：预留，默认关着（学生端现在查 GitHub）。要启用就把下面两行、
      # 以及 volumes 里那条 client-updates 的注释去掉，见 desktop/README.md「自建更新源」
      # CLIENT_UPDATES_ENABLED: "true"
      # CLIENT_UPDATE_DIR: /app/data/client-updates
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在 .env 里设置 ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # 个人云盘（2.25.0）：后端用 OpenList 的管理接口给老师建账号、分空间，见 backend/app/services/cloud.py。
      # OpenList 管理员密码不填就由 JWT_SECRET 推出来（和下面 openlist 服务里的算法一样）
      OPENLIST_URL: http://openlist:5244/cloud
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD:-}
      CLOUD_STORAGE_DIR: /cloud-storage
      TZ: Asia/Shanghai
    volumes:
      # 个人云盘根目录：后端在这里给老师建文件夹、量用量、看磁盘还剩多少
      - ${CLOUD_STORAGE_DIR:-/home/WFXXKJ_ExamSystem_CloudStorage}:/cloud-storage
      # 上传的图片和 Excel 原件挂到宿主机，容器重建数据不丢
      - ./data/uploads:/app/data/uploads
      # 网页派给宿主机的活（导入备份、一键更新）和执行日志，见 scripts/host-agent-install.sh
      - ./data/host-jobs:/app/data/host-jobs
      # 学生端 exe 的更新清单和安装包（自建更新源，预留）：启用后 scp 到宿主机这个目录就生效，不用重启
      # - ./data/client-updates:/app/data/client-updates:ro
      # 改完 config.yaml 只要 docker compose restart backend，不用重新构建
      - ./config.yaml:/app/config.yaml:ro
      # 原题库存档。全新部署时容器会从这里把 331 道题导进空库
      - ./legacy:/legacy:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 可选的 HTTPS，见 docs/部署指南.md「HTTPS」一节。HTTPS_PORT 不填就和以前一样只有 http。
      # 填了的话由 frontend/nginx/40-exam-https.sh 在容器启动时切换配置，并巡检证书续期。
      HTTPS_PORT: ${HTTPS_PORT:-}
      # 80 上的网页跳到哪：这里是 https 地址就跳到它，否则跳到同一主机名的 https
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
      # 没填 HTTPS_PORT 时展开成 127.0.0.1::443 —— 只在本机回环上随便占一个空闲端口，
      # 外面连不到，也不会和这台机器上已有的 443 / 8443 撞车，不影响没配证书的学校。
      # 填了（比如 443）就是正常的 443:443。
      - "${HTTPS_PORT:-127.0.0.1:}:443"
    volumes:
      # 证书目录只读挂进去，里面要有 fullchain.pem 和 key.pem（acme.sh --install-cert 装到这里）。
      # 挂的是目录不是文件：续期时 acme.sh 换掉文件，容器里立刻看得到。
      # 没填 SSL_CERT_DIR 时挂 ./data/ssl（空目录，docker 会自己建），不起作用。
      - ${SSL_CERT_DIR:-./data/ssl}:/etc/nginx/ssl:ro

  # 个人云盘（2.25.0）：开源网盘 OpenList，网页上是 /cloud/（前端 nginx 转过来，见 frontend/nginx/cloud.conf）。
  # 每位老师一个账号、根目录锁在自己的文件夹里；账号、空间都由教学平台管（账号页分配空间），
  # 不用进 OpenList 后台。文件在宿主机 /home/WFXXKJ_ExamSystem_CloudStorage/<用户名>/ 下。
  #
  # 它挂了不影响考试：后端不依赖它启动，nginx 也是访问 /cloud 时才去找它。
  openlist:
    image: ${REGISTRY:-docker.io}/openlistteam/openlist:v4.2.10
    restart: always
    logging: *default-logging
    # 用 root 跑：云盘目录是 docker 替我们在宿主机上建的（属主 root），镜像默认的 1001 用户写不进去
    user: "0:0"
    environment:
      # 网页挂在 /cloud 下（只写路径：域名、http/https 由浏览器当前地址决定，换域名不用改）
      SITE_URL: /cloud
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD:-}
      # 只用来推出管理员密码。**不能叫 JWT_SECRET**：openlist 以 --no-prefix 启动，同名变量会被它拿去当自己的密钥
      EXAM_SECRET: ${JWT_SECRET:?请先在 .env 里设置 JWT_SECRET}
      TZ: Asia/Shanghai
    # 每次启动先把管理员密码设成算好的那个（第一次启动时还没有管理员，靠 OPENLIST_ADMIN_PASSWORD 建出来；
    # 两样都不做的话 OpenList 会等人去网页上走安装向导，谁先打开 /cloud 谁就成了管理员）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PW="$${OPENLIST_ADMIN_PASSWORD:-}"
        [ -n "$$PW" ] || PW="$$(printf 'wfxx-openlist-admin:%s' "$$EXAM_SECRET" | sha256sum | cut -c1-32)"
        export OPENLIST_ADMIN_PASSWORD="$$PW"
        unset EXAM_SECRET
        ./openlist admin set "$$PW" --no-prefix >/dev/null 2>&1 || true
        exec ./openlist server --no-prefix
    volumes:
      # OpenList 自己的数据库（账号、设置），跟着项目的 data/ 走
      - ./data/openlist:/opt/openlist/data
      # 云盘根目录。想放别的盘就在 .env 里写 CLOUD_STORAGE_DIR=/data/cloud（后端那条挂载会跟着变）
      - ${CLOUD_STORAGE_DIR:-/home/WFXXKJ_ExamSystem_CloudStorage}:/cloud-storage

volumes:
  db_data:
