[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: keep this file pure ASCII. Alembic reads it with the system locale
# encoding, so non-ASCII comments break on non-UTF-8 systems (e.g. GBK Windows).
# The database URL is loaded from environment variables in alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
